name: Temporary AttendGate Handoff

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download compiled AttendGate Alpha 8 APK
        run: |
          curl -L --fail --retry 3 --retry-delay 2 'https://release-assets.githubusercontent.com/github-production-release-asset/1323039156/75e80b48-1e12-4c58-858c-e48d831e8dc2?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-08-09T20%3A36%3A11Z&rscd=attachment%3B+filename%3DAttendGate-v3.0.0-alpha8-ARM64.apk&rsct=application%2Fvnd.android.package-archive&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-08-09T19%3A35%3A15Z&ske=2026-08-09T20%3A36%3A11Z&sks=b&skv=2018-11-09&sig=zDOOOmftW13ptDab7q1DizygqNRYtd8p4YusboZ%2BTaw%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc4NjMwNjUwNSwibmJmIjoxNzg2MzA0NzA1LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.7ZbqxocULXmf2qujNkQ4IJvtTOt8cE1KKdNl5tR_X7A&response-content-disposition=attachment%3B%20filename%3DAttendGate-v3.0.0-alpha8-ARM64.apk&response-content-type=application%2Fvnd.android.package-archive' -o AttendGate-v3.0.0-alpha8-ARM64.apk
          echo 'b3c6f1c7f501ff750404f15e77155bc0e4bd7e8d8f1e67c184ac30247f44571f  AttendGate-v3.0.0-alpha8-ARM64.apk' | sha256sum -c -
          unzip -t AttendGate-v3.0.0-alpha8-ARM64.apk >/dev/null
          ls -lh AttendGate-v3.0.0-alpha8-ARM64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttendGate-v3.0.0-alpha8-ARM64
          path: AttendGate-v3.0.0-alpha8-ARM64.apk
          retention-days: 1
          compression-level: 0
