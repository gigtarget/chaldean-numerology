name: Temporary AttendGate Handoff

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Fetch AttendGate Alpha 3 source
        run: |
          git clone --depth 1 --branch attendgate-v3-build https://github.com/gigtarget/facial-attendacne.git attendgate
          cd attendgate
          cat attendgate-source.part-00 attendgate-source.part-01-* attendgate-source.part-02 attendgate-source.part-03 attendgate-source.part-04 > attendgate-source.b64
          base64 -d attendgate-source.b64 > attendgate-source.zip
          unzip -t attendgate-source.zip
          unzip -q attendgate-source.zip
          cp -a attendgate-patches/app/. app/

      - name: Install exact uploaded AttendGate icon
        run: |
          cd attendgate
          rm -f app/src/main/res/drawable/attendgate_launcher.xml
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d attendgate-assets/attendgate_launcher_256.png.b64 > app/src/main/res/drawable-nodpi/attendgate_launcher.png
          file app/src/main/res/drawable-nodpi/attendgate_launcher.png

      - name: Fetch verified SFace model
        run: |
          cd attendgate
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://huggingface.co/opencv/opencv_zoo/resolve/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx?download=true' \
            -o app/src/main/assets/face_recognition_sface_2021dec.onnx
          echo '0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79  app/src/main/assets/face_recognition_sface_2021dec.onnx' | sha256sum -c -

      - name: Build AttendGate Alpha 3 production UI
        run: |
          cd attendgate
          gradle :app:assembleDebug --stacktrace --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../AttendGate-v3.0.0-alpha3-ARM64.apk
          unzip -t ../AttendGate-v3.0.0-alpha3-ARM64.apk >/dev/null
          sha256sum ../AttendGate-v3.0.0-alpha3-ARM64.apk
          ls -lh ../AttendGate-v3.0.0-alpha3-ARM64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttendGate-v3.0.0-alpha3-ARM64
          path: AttendGate-v3.0.0-alpha3-ARM64.apk
          retention-days: 1
          compression-level: 0
