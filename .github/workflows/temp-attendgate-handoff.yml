name: Temporary AttendGate Handoff

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download compiled AttendGate Alpha 5 APK
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://github.com/gigtarget/facial-attendacne/releases/download/attendgate-v3.0.0-alpha5/AttendGate-v3.0.0-alpha5-ARM64.apk' \
            -o AttendGate-v3.0.0-alpha5-ARM64.apk
          echo 'ed8f219c54e722616c27aae83a89c614d89b8500288f07b12217bfc1cf0add34  AttendGate-v3.0.0-alpha5-ARM64.apk' | sha256sum -c -
          unzip -t AttendGate-v3.0.0-alpha5-ARM64.apk >/dev/null
          ls -lh AttendGate-v3.0.0-alpha5-ARM64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttendGate-v3.0.0-alpha5-ARM64
          path: AttendGate-v3.0.0-alpha5-ARM64.apk
          retention-days: 1
          compression-level: 0
