name: Temporary AttendGate Handoff

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download compiled AttendGate Alpha 10 APK
        run: |
          curl -L --fail --retry 3 --retry-delay 2 'https://release-assets.githubusercontent.com/github-production-release-asset/1323039156/a7480bb9-c964-4d16-a4b5-da65e40a8620?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-08-10T10%3A50%3A42Z&rscd=attachment%3B+filename%3DAttendGate-v3.0.0-alpha10-ARM64.apk&rsct=application%2Fvnd.android.package-archive&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-08-10T09%3A50%3A20Z&ske=2026-08-10T10%3A50%3A42Z&sks=b&skv=2018-11-09&sig=gQgRpm0lTxGpye6um4Gk2Z7sZJ2XKjDF%2FKjET6ZBh1k%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc4NjM1OTE3MiwibmJmIjoxNzg2MzU1NTcyLCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ._88Ti36FGeQyHcX9h90GYFsi7d2GagCQPT-4EgJNOA4&response-content-disposition=attachment%3B%20filename%3DAttendGate-v3.0.0-alpha10-ARM64.apk&response-content-type=application%2Fvnd.android.package-archive' -o AttendGate-v3.0.0-alpha10-ARM64.apk
          echo '50c327ffbe56ec99ee1b3e2c914beb983677c6936c1ca3b4077411b212f5b024  AttendGate-v3.0.0-alpha10-ARM64.apk' | sha256sum -c -
          unzip -t AttendGate-v3.0.0-alpha10-ARM64.apk >/dev/null
          ls -lh AttendGate-v3.0.0-alpha10-ARM64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttendGate-v3.0.0-alpha10-ARM64
          path: AttendGate-v3.0.0-alpha10-ARM64.apk
          retention-days: 1
          compression-level: 0
