name: Temporary AttendGate Handoff

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download compiled AttendGate Alpha 3 APK
        run: |
          curl -L --fail --retry 3 --retry-delay 2 'https://github.com/gigtarget/facial-attendacne/releases/download/attendgate-v3.0.0-alpha2/AttendGate-v3.0.0-alpha2-ARM64.apk' -o AttendGate-v3.0.0-alpha3-ARM64.apk
          echo '3b91ece75298da5676a1735bcdd7a27676188dac3e195ffad520aa89e31551a4  AttendGate-v3.0.0-alpha3-ARM64.apk' | sha256sum -c -
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttendGate-v3.0.0-alpha3-ARM64
          path: AttendGate-v3.0.0-alpha3-ARM64.apk
          retention-days: 1
          compression-level: 0
