name: Temporary AttendGate Handoff

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download compiled AttendGate Alpha 7 APK
        run: |
          curl -L --fail --retry 3 --retry-delay 2 'https://release-assets.githubusercontent.com/github-production-release-asset/1323039156/b1334d07-f5b1-49c0-8971-cbf80ebb6f3d?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-08-09T20%3A06%3A28Z&rscd=attachment%3B+filename%3DAttendGate-v3.0.0-alpha7-ARM64.apk&rsct=application%2Fvnd.android.package-archive&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-08-09T19%3A06%3A25Z&ske=2026-08-09T20%3A06%3A28Z&sks=b&skv=2018-11-09&sig=i0jhTxQp8blXUfRBNwCSbRp3nGhCXDuExLYJ96MQHSE%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc4NjMwNDU0OCwibmJmIjoxNzg2MzAyNzQ4LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.KJF6A7DjVtCTb5ZJE8BUq7PktzciE5EDrK3IFTB00-o&response-content-disposition=attachment%3B%20filename%3DAttendGate-v3.0.0-alpha7-ARM64.apk&response-content-type=application%2Fvnd.android.package-archive' -o AttendGate-v3.0.0-alpha7-ARM64.apk
          echo 'd031648d6d0216b94a2eadb81ef80ce136b2f05399e0e9d4218cc1a1dd8d653b  AttendGate-v3.0.0-alpha7-ARM64.apk' | sha256sum -c -
          unzip -t AttendGate-v3.0.0-alpha7-ARM64.apk >/dev/null
          ls -lh AttendGate-v3.0.0-alpha7-ARM64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttendGate-v3.0.0-alpha7-ARM64
          path: AttendGate-v3.0.0-alpha7-ARM64.apk
          retention-days: 1
          compression-level: 0
