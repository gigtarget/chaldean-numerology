name: Temporary AttendGate Handoff

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download compiled AttendGate Alpha 9 APK
        run: |
          curl -L --fail --retry 3 --retry-delay 2 'https://release-assets.githubusercontent.com/github-production-release-asset/1323039156/969fcc7d-d8b4-4605-9d1d-f58e400ffcc9?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-08-10T09%3A41%3A45Z&rscd=attachment%3B+filename%3DAttendGate-v3.0.0-alpha9-ARM64.apk&rsct=application%2Fvnd.android.package-archive&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-08-10T08%3A41%3A05Z&ske=2026-08-10T09%3A41%3A45Z&sks=b&skv=2018-11-09&sig=y0gafoepYP810J6EPXj0Ie2U5rUnT2hlpKvRalopGzo%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc4NjM1NTI1MCwibmJmIjoxNzg2MzUxNjUwLCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.ZZqbmji4RsVe9zwyhDVstNiYm3BCRg_FQsozQ29K0a8&response-content-disposition=attachment%3B%20filename%3DAttendGate-v3.0.0-alpha9-ARM64.apk&response-content-type=application%2Fvnd.android.package-archive' -o AttendGate-v3.0.0-alpha9-ARM64.apk
          echo 'dc8fe024bad3c877080acf0ad6ed32d6c3b48af298012e60b8d1629540480d3f  AttendGate-v3.0.0-alpha9-ARM64.apk' | sha256sum -c -
          unzip -t AttendGate-v3.0.0-alpha9-ARM64.apk >/dev/null
          ls -lh AttendGate-v3.0.0-alpha9-ARM64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttendGate-v3.0.0-alpha9-ARM64
          path: AttendGate-v3.0.0-alpha9-ARM64.apk
          retention-days: 1
          compression-level: 0
